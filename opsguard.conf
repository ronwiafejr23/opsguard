# opsguard configuration
# After installing, edit /etc/opsguard/opsguard.conf (this file is the template).
# Values are plain Bash assignments. Lists are space-separated.

# Name shown in alerts and reports. Defaults to the machine's hostname.
#HOST_LABEL="web-01"

# --- Health checks (opsguard check, every 5 minutes) -------------------------
CPU_THRESHOLD=90          # alert when CPU usage % is at or above this
MEM_THRESHOLD=90          # alert when memory usage % is at or above this
DISK_THRESHOLD=85         # alert when any mount below is this % full
DISK_MOUNTS="/"           # e.g. "/ /var /home"

# systemd services that must be running. Use "sshd" on RHEL/Fedora, "ssh" on Ubuntu/Debian.
SERVICES="ssh cron"
AUTO_RESTART_SERVICES=no  # yes = try "systemctl restart" once before alerting

# Alert if the last successful backup is older than this many hours (0 = off).
BACKUP_MAX_AGE_HOURS=26

# --- Alerts -------------------------------------------------------------------
# Slack incoming webhook (https://api.slack.com/messaging/webhooks). Leave empty to disable.
SLACK_WEBHOOK_URL=""
# Email address for alerts and the daily report. Needs a working "sendmail" (see README).
ALERT_EMAIL=""
#EMAIL_FROM="opsguard@example.com"
# Don't repeat the same alert more often than this (seconds).
ALERT_COOLDOWN=3600

# --- Backups (opsguard backup, nightly at 02:00) ------------------------------
BACKUP_DIR="/var/backups/opsguard"
BACKUP_PATHS="/etc /home"            # absolute paths to archive
BACKUP_EXCLUDES="*.tmp *.cache */node_modules"
POSTGRES_DBS=""                      # e.g. "app_production crm"
MYSQL_DBS=""                         # e.g. "wordpress"  (uses root's ~/.my.cnf or socket auth)
KEEP_DAILY=7                         # daily backups to keep
KEEP_WEEKLY=4                        # weekly (Sunday) backups to keep
# Optional off-site copy via rsync over SSH, e.g. "backup@10.0.0.5:/srv/backups/web-01"
REMOTE_BACKUP_TARGET=""
NOTIFY_ON_BACKUP_SUCCESS=no

# --- Security scan (opsguard security, hourly) --------------------------------
SECURITY_WINDOW="1 hour ago"         # how far back each scan looks
FAILED_LOGIN_THRESHOLD=10            # alert when one IP fails this many SSH logins

# --- Internal paths -----------------------------------------------------------
STATE_DIR="/var/lib/opsguard"
LOG_FILE="/var/log/opsguard.log"
